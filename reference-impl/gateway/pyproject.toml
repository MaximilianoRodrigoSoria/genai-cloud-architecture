[tool.poetry]
name = "genai-gateway"
version = "0.1.0"
description = "Gateway multi-tenant de referencia (auth + rate limit + cache por tenant)."
license = "MIT"
authors = ["Maximiliano R. Soria"]
packages = [{ include = "gateway", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.111"
uvicorn = { extras = ["standard"], version = ">=0.30" }

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
httpx = ">=0.27"
ruff = ">=0.5"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
